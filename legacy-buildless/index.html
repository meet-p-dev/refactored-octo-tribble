<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="MoneyTrack"/>
<title>MoneyTrack</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body,#root{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
input,select,button,textarea{font-family:inherit;font-size:16px;-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation}
input:focus,select:focus,textarea:focus{outline:none}
::-webkit-scrollbar{display:none}
input[type=color]{-webkit-appearance:none;border:none;cursor:pointer}
input[type=date]{color-scheme:auto}
select{-webkit-appearance:none}
@keyframes mtFade{from{opacity:0}to{opacity:1}}
@keyframes mtRise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
@keyframes mtPop{0%{transform:scale(.8);opacity:0}60%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
@keyframes mtSheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes mtConfetti{0%{transform:translateY(-10vh) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:.9}}
@keyframes mtShake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.mt-rise{animation:mtRise .42s cubic-bezier(.22,1,.36,1) both}
.mt-pop{animation:mtPop .34s cubic-bezier(.34,1.56,.64,1) both}
.mt-press{transition:transform .12s ease}
.mt-press:active{transform:scale(.94)}
.mt-hscroll{display:flex;gap:11px;overflow-x:auto;scroll-snap-type:x proximity;scroll-padding:0 16px;padding:2px 16px;margin:0 -16px}
.mt-hscroll>*{scroll-snap-align:start;flex-shrink:0}
.mt-label{font-size:11px;font-weight:600;letter-spacing:1.1px;text-transform:uppercase;margin:18px 2px 8px;display:block}
.mt-stagger>*{animation:mtRise .22s cubic-bezier(.22,1,.36,1) both}
.mt-stagger>*:nth-child(1){animation-delay:0ms}
.mt-stagger>*:nth-child(2){animation-delay:18ms}
.mt-stagger>*:nth-child(3){animation-delay:36ms}
.mt-stagger>*:nth-child(4){animation-delay:54ms}
.mt-stagger>*:nth-child(5){animation-delay:72ms}
.mt-stagger>*:nth-child(n+6){animation-delay:90ms}
.mt-tap{cursor:pointer;transition:transform .12s ease,opacity .12s ease}
.mt-tap:active{transform:scale(.97);opacity:.85}
.mt-scaleback{transition:transform .3s cubic-bezier(.32,.72,0,1),border-radius .3s,filter .3s}
.mt-scaleback.dimmed{transform:scale(.96) translateY(6px);border-radius:22px;filter:brightness(.75);overflow:hidden}
@supports(padding:max(0px)){.mt-safe-b{padding-bottom:max(10px,env(safe-area-inset-bottom))}}
</style>
</head>
<body>
<div id="root"><div style="font-family:-apple-system,sans-serif;padding:40px 24px;text-align:center;color:#8e8e93;font-size:15px;line-height:1.6">This dev version needs the local server.<br>Run <b>python3 -m http.server 8123</b> here and open <b>http://127.0.0.1:8123/</b><br><br>To use the app directly, open <b>moneytrack.html</b> instead.</div></div>
<script type="text/babel" src="js/core.jsx"></script>
<script type="text/babel" src="js/components.jsx"></script>
<script type="text/babel" src="js/app.jsx"></script>
</body>
</html>
