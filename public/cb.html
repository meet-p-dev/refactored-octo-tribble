<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><meta name="theme-color" content="#000000">
<title>Bank connected · MoneyTrack</title>
<!-- Where the bank sends the user back after they approve the consent. MoneyTrack's
     own copy, on MoneyTrack's own site — the live flow still points at Heimat's
     (see the EB_REDIRECT_URL default in the mt-bank-auth-start edge function), and
     switching it over needs the redirect updated at Enable Banking first. Until
     then this page just sits here, deployed and ready. Plain HTML on purpose: the
     bank returns to it cold, and it must never depend on the app bundle. -->
<style>
:root{color-scheme:light dark}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;background:#f4f2ee;color:#1a1a1c}
.wrap{max-width:420px;margin:0 auto;padding:48px 20px 40px;box-sizing:border-box}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:28px}
.mark{width:34px;height:34px;border-radius:11px;background:#007aff;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:17px}
.name{font-size:17px;font-weight:700;letter-spacing:-.2px}
h1{font-size:23px;font-weight:700;letter-spacing:-.4px;margin:0 0 10px}
p{font-size:14px;color:#6b7280;line-height:1.55;margin:0 0 20px}
.code{font-size:14px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#fff;border:1.5px solid #d6d3cc;border-radius:14px;padding:15px 16px;word-break:break-all;margin:0 0 12px}
button{width:100%;box-sizing:border-box;background:#007aff;color:#fff;border:none;border-radius:16px;padding:16px;font-weight:700;font-size:16px;cursor:pointer}
.small{font-size:12px;color:#aeaeb2;line-height:1.5;margin:18px 0 0;text-align:center}
@media(prefers-color-scheme:dark){
body{background:#000;color:#fff}p{color:#8e8e93}.mark{background:#0a84ff}
.code{background:#232326;border-color:#3a3a3f}button{background:#0a84ff}.small{color:#55555a}}
</style></head><body>
<div class="wrap">
  <div class="brand"><div class="mark">M</div><div class="name">MoneyTrack</div></div>
  <h1 id="t">Bank connected</h1>
  <p id="s">Copy this code, go back to MoneyTrack → Bank Sync, and paste it into “Paste code from bank page”.</p>
  <div class="code" id="c">…</div>
  <button id="b">Copy code</button>
  <p class="small" id="f">You can close this tab once the code is pasted.</p>
</div>
<script>
var p = new URLSearchParams(location.search);
var code = p.get('code');
var c = document.getElementById('c'), b = document.getElementById('b');
if (code) {
  c.textContent = code;
  b.onclick = function () {
    navigator.clipboard.writeText(code).then(function () {
      b.textContent = 'Copied ✓';
      setTimeout(function () { b.textContent = 'Copy code'; }, 1600);
    });
  };
} else {
  // the bank refused or the user backed out — say which, rather than showing an empty box
  document.getElementById('t').textContent = 'Not connected';
  document.getElementById('s').textContent = 'Your bank did not return a code, so nothing was connected. Go back to MoneyTrack and try again.';
  c.textContent = p.get('error_description') || p.get('error') || 'No code returned.';
  b.textContent = 'Back to MoneyTrack';
  document.getElementById('f').textContent = 'Nothing was shared with MoneyTrack.';
  b.onclick = function () { location.href = '/refactored-octo-tribble/'; };
}
</script></body></html>
